<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ghost Demo Wallet</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ghost Demo">
<meta name="theme-color" content="#0b0b10">
<link rel="apple-touch-icon" href="icon-180.png"><link rel="manifest" href="manifest.json">
<style>
:root{--bg:#0b0b10;--card:#16161f;--card2:#1e1e2a;--tx:#f4f4f8;--mut:#8b8ba0;--p:#7c5cff;--b:#3b82f6;--g:#34d399;--r:#f87171;--ln:rgba(255,255,255,.07);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px)}
@media(prefers-color-scheme:dark){:root{color-scheme:dark}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--tx);font:15px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,system-ui,sans-serif}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
#shell{max-width:480px;margin:0 auto;height:100%;position:relative;overflow:hidden;background:radial-gradient(120% 40% at 50% 0,#2a1d5e55,transparent 70%),var(--bg)}
#app{height:100%;overflow-y:auto;padding:12px 16px calc(96px + env(safe-area-inset-bottom,0px));animation:in .25s ease}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
h1,h2,h3{margin:0}h2{font-size:13px;color:var(--mut);font-weight:600;text-transform:uppercase;letter-spacing:.06em;margin:22px 0 10px}
.demo{font-size:10px;font-weight:700;letter-spacing:.08em;color:#fbbf24;border:1px solid #fbbf2466;border-radius:6px;padding:2px 6px;background:#fbbf2418}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.bal{font-size:40px;font-weight:700;letter-spacing:-.02em;margin:6px 0 2px;text-shadow:0 0 30px #7c5cff66}
.chg{font-size:14px;font-weight:600}.up{color:var(--g)}.dn{color:var(--r)}
.row{display:flex;align-items:center;gap:12px}.sp{flex:1;min-width:0}
.btn,button{font:inherit;color:inherit;border:0;cursor:pointer;transition:transform .12s,opacity .12s}
button:active{transform:scale(.95);opacity:.8}
.ic{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:13px;color:#fff;flex:none}
.card{background:var(--card);border-radius:18px;border:1px solid var(--ln)}
.acts{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:16px 0}
.act{background:var(--card);border-radius:16px;padding:12px 0;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;font-weight:600;border:1px solid var(--ln)}
.act i{font-style:normal;font-size:20px;color:#b9a6ff}
.rng{display:flex;justify-content:space-between;margin-top:6px}
.rng button{background:none;color:var(--mut);font-weight:600;padding:6px 12px;border-radius:10px;font-size:13px}
.rng button.on{background:var(--card2);color:#c9bcff}
.li{display:flex;align-items:center;gap:12px;padding:13px 14px;border-bottom:1px solid var(--ln);cursor:pointer}.li:last-child{border:0}
.r{text-align:right}.m{color:var(--mut);font-size:13px}
.tabs{position:absolute;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(5,1fr);background:#0b0b10e8;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid var(--ln);padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px))}
.tabs button{background:none;color:var(--mut);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;font-weight:600;padding:4px}
.tabs button span{font-size:22px}.tabs button.on{color:#b9a6ff}
.pill{display:inline-block;padding:7px 14px;border-radius:20px;background:var(--card);color:var(--mut);font-weight:600;font-size:13px;margin-right:6px;border:1px solid var(--ln)}.pill.on{background:var(--p);color:#fff}
.st{font-size:11px;font-weight:700;padding:2px 8px;border-radius:8px}
.completed{background:#34d39922;color:var(--g)}.pending{background:#fbbf2422;color:#fbbf24}.failed{background:#f8717122;color:var(--r)}
input,select{width:100%;background:var(--card2);border:1px solid var(--ln);color:var(--tx);border-radius:12px;padding:12px;font:inherit;font-size:16px;outline:none}
input:focus,select:focus{border-color:var(--p)}
.sm input,.sm select{padding:8px;font-size:14px;border-radius:9px}
.pri{width:100%;background:linear-gradient(135deg,var(--p),var(--b));color:#fff;font-weight:700;padding:15px;border-radius:14px;margin-top:14px;box-shadow:0 8px 30px #7c5cff55}
.sec{background:var(--card2);color:var(--tx);padding:9px 14px;border-radius:11px;font-weight:600;font-size:13px}
.back{background:var(--card);width:36px;height:36px;border-radius:50%;font-size:18px}
.sheet{position:absolute;inset:0;background:#000a;display:flex;align-items:flex-end;z-index:9;animation:fade .2s}
.sheet>div{width:100%;background:#12121a;border-radius:26px 26px 0 0;padding:20px 18px calc(24px + env(safe-area-inset-bottom,0px));animation:up .28s cubic-bezier(.2,.9,.3,1);max-height:92%;overflow:auto;border-top:1px solid var(--ln)}
@keyframes up{from{transform:translateY(100%)}}@keyframes fade{from{opacity:0}}
label{display:block;font-size:12px;color:var(--mut);margin:12px 0 5px;font-weight:600}
.err{color:var(--r);font-size:13px;margin-top:8px}
.note{background:#fbbf2412;border:1px solid #fbbf2433;color:#fcd68a;border-radius:12px;padding:10px 12px;font-size:12px;margin-top:12px}
.nft{border-radius:18px;overflow:hidden;background:var(--card);border:1px solid var(--ln)}
.nft div.a{aspect-ratio:1;display:grid;place-items:center;font-size:44px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.x{background:none;color:var(--r);font-size:18px;padding:4px 8px}
@media(min-width:700px){body{background:#050508}#shell{height:min(900px,96vh);margin-top:2vh;border-radius:36px;border:1px solid var(--ln)}}
</style></head>
<body><div id="shell"><div id="app"></div></div>
<script>
const COL={SOL:'#9945ff',ETH:'#627eea',BTC:'#f7931a',USDC:'#2775ca'};
const DEF=()=>({mode:'calc',manual:12480.55,hide:false,
tokens:[{id:'sol',name:'Solana',sym:'SOL',qty:48.2,price:162.4,c:'#9945ff'},{id:'eth',name:'Ethereum',sym:'ETH',qty:1.35,price:3120.5,c:'#627eea'},{id:'btc',name:'Bitcoin',sym:'BTC',qty:0.052,price:64210,c:'#f7931a'},{id:'usdc',name:'USD Coin',sym:'USDC',qty:1250,price:1,c:'#2775ca'}],
txs:[{id:1,type:'recv',sym:'SOL',amt:12,status:'completed',ts:Date.now()-36e5*3},{id:2,type:'sent',sym:'ETH',amt:0.25,status:'pending',ts:Date.now()-36e5*20},{id:3,type:'swap',sym:'USDC',amt:400,status:'completed',ts:Date.now()-864e5*2},{id:4,type:'sent',sym:'BTC',amt:0.01,status:'failed',ts:Date.now()-864e5*4},{id:5,type:'recv',sym:'USDC',amt:850,status:'completed',ts:Date.now()-864e5*6}],
nfts:[{id:1,name:'Neon Ghost #12',col:'Ghost Club',g:'#7c5cff,#3b82f6',e:'👻'},{id:2,name:'Pixel Orbit #204',col:'Orbitals',g:'#f97316,#ec4899',e:'🪐'},{id:3,name:'Void Bloom #7',col:'Bloomverse',g:'#10b981,#3b82f6',e:'🌸'},{id:4,name:'Aurora Cat #88',col:'Aurora Cats',g:'#a855f7,#f472b6',e:'🐱'}]});
let S;try{S=JSON.parse(localStorage.getItem('ghostdemo'))||DEF()}catch(e){S=DEF()}
const save=()=>{try{localStorage.setItem('ghostdemo',JSON.stringify(S))}catch(e){}};
let V={cv:{amt:'1',from:'SOL',to:'USD'},tab:'wallet',tok:null,sh:null,flt:'all',rng:'1D'};
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const usd=n=>(isFinite(n)?n:0).toLocaleString('en-US',{style:'currency',currency:'USD'});
const num=(n,d=4)=>(+n).toLocaleString('en-US',{maximumFractionDigits:d});
const calc=()=>S.tokens.reduce((a,t)=>a+t.qty*t.price,0);
const total=()=>S.mode==='manual'?S.manual:calc();
const hid=s=>S.hide?'••••••':s;
const tk=sym=>S.tokens.find(t=>t.sym===sym);
</script>
<script>
function series(seed,end,rng){let h=7;for(const ch of seed+rng)h=(h*31+ch.charCodeAt(0))>>>0;const r=()=>(h=(h*1664525+1013904223)>>>0)/4294967296;
const vol={'1D':.02,'1W':.05,'1M':.1,'1Y':.3,'ALL':.5}[rng],n=48,a=[end];for(let i=1;i<n;i++)a.unshift(a[0]*(1+(r()-.5)*vol/4+(rng==='1D'?0:.002)));return a}
function chart(pts){const w=340,h=120,mn=Math.min(...pts),mx=Math.max(...pts),sp=mx-mn||1;
const xy=pts.map((v,i)=>[i/(pts.length-1)*w,h-8-(v-mn)/sp*(h-16)]),d=xy.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join('');
const up=pts[pts.length-1]>=pts[0],c=up?'#34d399':'#f87171';
return `<svg viewBox="0 0 ${w} ${h}" width="100%" height="120" preserveAspectRatio="none"><defs><linearGradient id="gg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${c}" stop-opacity=".35"/><stop offset="1" stop-color="${c}" stop-opacity="0"/></linearGradient></defs><path d="${d}L${w} ${h}L0 ${h}Z" fill="url(#gg)"/><path d="${d}" fill="none" stroke="${c}" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="filter:drop-shadow(0 0 6px ${c})"/></svg>`}
const pct=p=>{const c=(p[p.length-1]/p[0]-1)*100;return `<span class="chg ${c>=0?'up':'dn'}">${c>=0?'▲':'▼'} ${Math.abs(c).toFixed(2)}%</span>`};
const rngBar=()=>`<div class="rng">${['1D','1W','1M','1Y','ALL'].map(r=>`<button data-a="rng" data-v="${r}" class="${V.rng===r?'on':''}">${r}</button>`).join('')}</div>`;
const ic=(s,c)=>`<div class="ic" style="background:${c||COL[s]||'#555'}">${esc(s.slice(0,3))}</div>`;
const TY={recv:['Received','↓'],sent:['Sent','↑'],swap:['Swapped','⇄'],buy:['Bought','＋']};
const txRow=(t,del)=>`<div class="li" style="cursor:default"><div class="ic" style="background:var(--card2)">${TY[t.type][1]}</div><div class="sp"><b>${TY[t.type][0]} ${esc(t.sym)}</b><div class="m">${new Date(t.ts).toLocaleString('en-US',{month:'short',day:'numeric',hour:'numeric',minute:'2-digit'})}</div></div><div class="r"><b class="${t.type==='recv'||t.type==='buy'?'up':''}">${t.type==='sent'?'−':'+'}${hid(num(t.amt))} ${esc(t.sym)}</b><div><span class="st ${t.status}">${t.status}</span></div></div></div>`;
function home(){const T=total(),p=series('port',T,V.rng);
return `<div class="top"><div class="row"><div class="ic" style="background:linear-gradient(135deg,#7c5cff,#3b82f6)">👻</div><b data-a="nick" style="cursor:pointer">${esc(S.nick||'Account 1')} ✎</b></div><div class="row"><span class="demo">DEMO</span><button class="back" data-a="eye">${S.hide?'🙈':'👁'}</button></div></div>
<div class="bal">${hid(usd(T))}</div><div>${pct(p)} <span class="m">· simulated</span></div>${chart(p)}${rngBar()}
<div class="acts">${[['send','↑','Send'],['recv','↓','Receive'],['swap','⇄','Swap'],['buy','＋','Buy']].map(a=>`<button class="act" data-a="sheet" data-v="${a[0]}"><i>${a[1]}</i>${a[2]}</button>`).join('')}</div>
<h2>Tokens</h2><div class="card">${S.tokens.length?S.tokens.map(t=>`<div class="li" data-a="open" data-v="${t.id}">${ic(t.sym,t.c)}<div class="sp"><b>${esc(t.name)}</b><div class="m">${hid(num(t.qty))} ${esc(t.sym)}</div></div><div class="r"><b>${hid(usd(t.qty*t.price))}</b><div class="m">${usd(t.price)}</div></div></div>`).join(''):'<div class="li m">No tokens. Add some in Settings.</div>'}</div>
<h2>Recent activity</h2><div class="card">${S.txs.slice(0,3).map(t=>txRow(t)).join('')||'<div class="li m">No activity yet.</div>'}</div>
<p class="m" style="text-align:center;margin-top:20px">Demo only · simulated values · not real assets</p>`}
function token(){const t=S.tokens.find(x=>x.id===V.tok);if(!t){V.tok=null;return home()}const p=series(t.sym,t.price,V.rng),txs=S.txs.filter(x=>x.sym===t.sym);
return `<div class="top"><button class="back" data-a="back">‹</button><span class="demo">DEMO</span></div><div class="row" style="margin:10px 0">${ic(t.sym,t.c)}<div><h1>${esc(t.name)}</h1><div class="m">${esc(t.sym)}</div></div></div>
<div class="bal" style="font-size:34px">${usd(t.price)}</div>${pct(p)}${chart(p)}${rngBar()}
<div class="card" style="margin-top:16px;padding:14px"><div class="row"><div class="sp m">Your balance</div><b>${hid(num(t.qty))} ${esc(t.sym)}</b></div><div class="row" style="margin-top:8px"><div class="sp m">Value</div><b>${hid(usd(t.qty*t.price))}</b></div></div>
<div class="acts"><button class="act" data-a="sheet" data-v="send"><i>↑</i>Send</button><button class="act" data-a="sheet" data-v="recv"><i>↓</i>Receive</button><button class="act" data-a="sheet" data-v="swap"><i>⇄</i>Swap</button><button class="act" data-a="sheet" data-v="buy"><i>＋</i>Buy</button></div>
<h2>${esc(t.sym)} activity</h2><div class="card">${txs.map(x=>txRow(x)).join('')||'<div class="li m">No transactions for this token.</div>'}</div>
<button class="sec" style="margin-top:14px" data-a="tab" data-v="settings">Edit in Demo Settings</button>`}
function activity(){const f=V.flt,l=S.txs.filter(t=>f==='all'||t.type===f).sort((a,b)=>b.ts-a.ts);
return `<h1 style="margin:8px 0 14px">Activity</h1><div style="overflow-x:auto;white-space:nowrap">${[['all','All'],['recv','Received'],['sent','Sent'],['swap','Swaps']].map(x=>`<button class="pill ${f===x[0]?'on':''}" data-a="flt" data-v="${x[0]}">${x[1]}</button>`).join('')}</div><div class="card" style="margin-top:14px">${l.map(t=>txRow(t)).join('')||'<div class="li m">No matching transactions.</div>'}</div>`}
function rates(){const c=V.cv,opts=s=>['USD',...S.tokens.map(t=>t.sym)].map(x=>`<option ${x===s?'selected':''}>${esc(x)}</option>`).join(''),pr=s=>s==='USD'?1:(tk(s)||{price:0}).price,res=pr(c.to)?(parseFloat(c.amt)||0)*pr(c.from)/pr(c.to):0;
return `<h1 style="margin:8px 0 10px">Курс <span class="demo">DEMO</span></h1><div class="note">Курсы симулированные: их можно менять в Настройках. Это не реальные рыночные цены.</div><h2>Конвертер</h2><div class="card sm" style="padding:14px"><input type="number" inputmode="decimal" data-a="cvAmt" data-f="amt" value="${esc(c.amt)}"><div class="row" style="margin-top:8px"><select data-a="cvFrom" data-f="from">${opts(c.from)}</select><span>→</span><select data-a="cvTo" data-f="to">${opts(c.to)}</select></div><div style="font-size:24px;font-weight:700;margin-top:12px">${num(res,6)} ${esc(c.to)}</div></div><h2>Цены токенов</h2><div class="card">${S.tokens.map(t=>`<div class="li" data-a="open" data-v="${t.id}">${ic(t.sym,t.c)}<div class="sp"><b>${esc(t.sym)}</b><div class="m">${esc(t.name)}</div></div><div class="r"><b>${usd(t.price)}</b><div>${pct(series(t.sym,t.price,'1D'))}</div></div></div>`).join('')||'<div class="li m">Нет токенов.</div>'}</div>`}
function nfts(){return `<h1 style="margin:8px 0 14px">Collectibles</h1>${S.nfts.length?`<div class="grid">${S.nfts.map(n=>`<div class="nft"><div class="a" style="background:linear-gradient(135deg,${n.g||'#7c5cff,#3b82f6'})">${n.e||'🖼'}</div><div style="padding:10px 12px"><b>${esc(n.name)}</b><div class="m">${esc(n.col)}</div></div></div>`).join('')}</div>`:'<div class="card li m">No collectibles. Add demo items in Settings.</div>'}`}
const inp=(a,id,f,v,t='number')=>`<input type="${t}" inputmode="${t==='number'?'decimal':'text'}" step="any" data-a="${a}" data-id="${id}" data-f="${f}" value="${esc(v)}">`;
function settings(){return `<h1 style="margin:8px 0 4px">Demo Settings</h1><div class="note">Everything here is simulated and saved only on this device. Editing values never changes real blockchain assets.</div>
<h2>Никнейм</h2><div class="card" style="padding:14px">${inp('setNick','','',S.nick||'Account 1','text')}</div><h2>Balance mode</h2><div class="card" style="padding:14px"><div class="row"><button class="pill ${S.mode==='calc'?'on':''}" data-a="mode" data-v="calc">Calculated</button><button class="pill ${S.mode==='manual'?'on':''}" data-a="mode" data-v="manual">Manual total</button></div>
<label>Manual total (USD)</label>${inp('manual','', '',S.manual)}<div class="m" style="margin-top:6px">Calculated from tokens: ${usd(calc())}</div></div>
<h2>Tokens</h2><div class="card sm" style="padding:10px">${S.tokens.map(t=>`<div style="padding:8px 0;border-bottom:1px solid var(--ln)"><div class="row"><b class="sp">${esc(t.name)} (${esc(t.sym)})</b><button class="x" data-a="delTok" data-v="${t.id}">✕</button></div><div class="row" style="margin-top:6px"><div class="sp"><label style="margin:0 0 3px">Quantity</label>${inp('setTok',t.id,'qty',t.qty)}</div><div class="sp"><label style="margin:0 0 3px">Price (USD)</label>${inp('setTok',t.id,'price',t.price)}</div></div></div>`).join('')}
<label>Add token</label><div class="row"><input id="nt-n" placeholder="Name"><input id="nt-s" placeholder="TICK" style="width:90px"></div><div class="row" style="margin-top:6px"><input id="nt-q" type="number" placeholder="Qty"><input id="nt-p" type="number" placeholder="Price"></div><button class="sec" style="margin-top:8px" data-a="addTok">Add token</button></div>
<h2>Transactions</h2><div class="card sm" style="padding:10px">${S.txs.map(t=>`<div style="padding:8px 0;border-bottom:1px solid var(--ln)"><div class="row"><b class="sp">${TY[t.type][0]} ${esc(t.sym)}</b><button class="x" data-a="delTx" data-v="${t.id}">✕</button></div><div class="row" style="margin-top:6px"><div class="sp">${inp('setTx',t.id,'amt',t.amt)}</div><div class="sp"><select data-a="setTx" data-id="${t.id}" data-f="status">${['completed','pending','failed'].map(s=>`<option ${t.status===s?'selected':''}>${s}</option>`).join('')}</select></div></div></div>`).join('')}
<label>Add transaction</label><div class="row"><select id="nx-t"><option value="recv">Received</option><option value="sent">Sent</option><option value="swap">Swap</option></select><select id="nx-s">${S.tokens.map(t=>`<option>${esc(t.sym)}</option>`).join('')}</select></div><div class="row" style="margin-top:6px"><input id="nx-a" type="number" placeholder="Amount"><select id="nx-st"><option>completed</option><option>pending</option><option>failed</option></select></div><button class="sec" style="margin-top:8px" data-a="addTx">Add transaction</button></div>
<h2>Collectibles</h2><div class="card sm" style="padding:10px">${S.nfts.map(n=>`<div class="row" style="padding:6px 0"><span class="sp">${n.e||'🖼'} ${esc(n.name)}</span><button class="x" data-a="delNft" data-v="${n.id}">✕</button></div>`).join('')}<div class="row" style="margin-top:6px"><input id="nn-n" placeholder="Item name"><input id="nn-c" placeholder="Collection"></div><button class="sec" style="margin-top:8px" data-a="addNft">Add collectible</button></div>
<h2>Install on iPhone</h2><div class="card" style="padding:14px"><ol style="margin:0;padding-left:18px;line-height:1.8"><li>Open this page in <b>Safari</b>.</li><li>Tap the <b>Share</b> button.</li><li>Choose <b>Add to Home Screen</b>.</li><li>Tap <b>Add</b> to confirm.</li></ol></div>
<button class="sec" style="margin-top:18px;color:var(--r);width:100%" data-a="reset">Reset to default demo data</button>`}
function sheet(){const s=V.sh,f=s.f,n=s.type,tkOpts=(sel)=>S.tokens.map(t=>`<option ${t.sym===sel?'selected':''}>${esc(t.sym)}</option>`).join('');
const T={send:'Send',recv:'Receive',swap:'Swap',buy:'Buy'}[n];let b='';
if(s.step===2)b=`<div style="text-align:center;padding:20px 0"><div style="font-size:48px">✅</div><h3 style="margin:10px 0">Demo ${T} complete</h3><p class="m">Simulated only. No real transaction was sent and no blockchain was contacted.</p></div><button class="pri" data-a="close">Done</button>`;
else if(s.step===1)b=`<div class="card" style="padding:14px"><div class="row"><span class="sp m">Action</span><b>${T}</b></div><div class="row" style="margin-top:8px"><span class="sp m">Amount</span><b>${num(f.amt)} ${esc(f.from)}${n==='buy'?'':''}</b></div>${n==='send'?`<div class="row" style="margin-top:8px"><span class="sp m">To</span><b>${esc(f.addr)}</b></div>`:''}${n==='swap'?`<div class="row" style="margin-top:8px"><span class="sp m">For</span><b>≈ ${num(f.amt*tk(f.from).price/tk(f.to).price)} ${esc(f.to)}</b></div>`:''}</div><div class="note">Demo only — confirming will not move real funds.</div><button class="pri" data-a="confirm">Confirm (simulated)</button><button class="sec" style="width:100%;margin-top:8px" data-a="prev">Back</button>`;
else b=(n==='send'?`<label>Recipient (demo address)</label><input data-a="f" data-f="addr" value="${esc(f.addr)}" placeholder="Any text, e.g. DemoAddr…">`:'')+`<label>${n==='swap'?'From':n==='buy'?'Token to buy':'Token'}</label><select data-a="f" data-f="from">${tkOpts(f.from)}</select>`+(n==='swap'?`<label>To</label><select data-a="f" data-f="to">${tkOpts(f.to)}</select>`:'')+(n==='recv'?`<div class="card" style="padding:14px;margin-top:12px;word-break:break-all"><div class="m">Demo address (not real)</div><b>DEMO7x9Fq2Lk0Zp3VnW8aTgR5uYb1CeHs</b></div>`:'')+`<label>${n==='buy'?'Amount (USD)':n==='recv'?'Simulated amount to receive':'Amount'}</label><input type="number" inputmode="decimal" data-a="f" data-f="amt" value="${esc(f.amt)}" placeholder="0.00">${s.err?`<div class="err">${esc(s.err)}</div>`:''}<div class="note">Demo only. No wallet connection, payment or blockchain.</div><button class="pri" data-a="next">Continue</button>`;
return `<div class="sheet" data-a="close"><div data-a="stop"><div class="row" style="margin-bottom:6px"><h3 class="sp" style="font-size:20px">${T} <span class="demo">DEMO</span></h3><button class="back" data-a="close">✕</button></div>${b}</div></div>`}
function render(){const keep=$('#app')?$('#app').scrollTop:0;let v=V.tok&&V.tab==='wallet'?token():{wallet:home,rates,activity,nfts,settings}[V.tab]();
const tab=(k,i,l)=>`<button class="${V.tab===k?'on':''}" data-a="tab" data-v="${k}"><span>${i}</span>${l}</button>`;
$('#shell').innerHTML=`<div id="app">${v}</div><nav class="tabs">${tab('wallet','◐','Wallet')}${tab('rates','📈','Курс')}${tab('activity','⏱','Activity')}${tab('nfts','🖼','NFTs')}${tab('settings','⚙','Settings')}</nav>${V.sh?sheet():''}`;
$('#app').scrollTop=keep;save()}
const id=()=>Date.now()+Math.floor(Math.random()*999),pos=x=>isFinite(x)&&x>0;
function A(a,v,el,ev){
if(a==='tab'){V.tab=v;V.tok=null;V.sh=null}
else if(a==='open'){V.tok=v;V.tab='wallet'}else if(a==='nick'){const n=prompt('Никнейм',S.nick||'Account 1');if(n===null)return;S.nick=n.trim().slice(0,20)||'Account 1'}else if(a==='back')V.tok=null;
else if(a==='rng')V.rng=v;else if(a==='eye')S.hide=!S.hide;else if(a==='flt')V.flt=v;
else if(a==='sheet'){const t=V.tok&&S.tokens.find(x=>x.id===V.tok);V.sh={type:v,step:0,f:{from:(t||S.tokens[0]||{}).sym||'',to:(S.tokens[1]||{}).sym||'',amt:'',addr:''}}}
else if(a==='close'){if(ev.target!==el&&el.classList.contains('sheet'))return;V.sh=null}
else if(a==='stop')return;
else if(a==='prev')V.sh.step=0;
else if(a==='next'){const s=V.sh,f=s.f,t=tk(f.from),amt=parseFloat(f.amt);s.err='';
if(!t)s.err='Add a token in Settings first.';else if(!pos(amt))s.err='Enter an amount greater than 0.';
else if(s.type==='send'&&!f.addr.trim())s.err='Enter a recipient.';
else if(s.type==='send'&&amt>t.qty)s.err='Amount exceeds your simulated balance.';
else if(s.type==='swap'&&(f.from===f.to||amt>t.qty))s.err=f.from===f.to?'Choose two different tokens.':'Amount exceeds your simulated balance.';
if(!s.err)s.step=1}
else if(a==='confirm'){const s=V.sh,f=s.f,t=tk(f.from),amt=+f.amt;
if(s.type==='send')t.qty-=amt;else if(s.type==='recv')t.qty+=amt;else if(s.type==='buy')t.qty+=amt/t.price;
else{const u=tk(f.to);u.qty+=amt*t.price/u.price;t.qty-=amt}
S.txs.unshift({id:id(),type:s.type==='buy'?'recv':s.type,sym:s.type==='swap'?f.to:f.from,amt:s.type==='buy'?amt/t.price:s.type==='swap'?amt*t.price/tk(f.to).price:amt,status:'completed',ts:Date.now()});s.step=2}
else if(a==='mode')S.mode=v;
else if(a==='delTok'){if(!confirm('Remove this demo token?'))return;S.tokens=S.tokens.filter(t=>t.id!==v)}
else if(a==='delTx')S.txs=S.txs.filter(t=>t.id!=v);else if(a==='delNft')S.nfts=S.nfts.filter(t=>t.id!=v);
else if(a==='addTok'){const n=$('#nt-n').value.trim(),y=$('#nt-s').value.trim().toUpperCase(),q=parseFloat($('#nt-q').value),p=parseFloat($('#nt-p').value);
if(!n||!y||!(q>=0)||!(p>=0)||S.tokens.some(t=>t.sym===y))return alert('Enter a unique name & ticker, and valid quantity and price.');
S.tokens.push({id:'t'+id(),name:n,sym:y,qty:q,price:p,c:'#'+Math.floor(Math.random()*0xffffff).toString(16).padStart(6,'0')})}
else if(a==='addTx'){const am=parseFloat($('#nx-a').value);if(!pos(am)||!S.tokens.length)return alert('Enter a valid amount.');
S.txs.unshift({id:id(),type:$('#nx-t').value,sym:$('#nx-s').value,amt:am,status:$('#nx-st').value,ts:Date.now()})}
else if(a==='addNft'){const n=$('#nn-n').value.trim();if(!n)return alert('Enter an item name.');
const gs=['#7c5cff,#3b82f6','#f97316,#ec4899','#10b981,#3b82f6','#a855f7,#f472b6'],es=['🦄','🌌','🔮','🐉','🎭'];
S.nfts.push({id:id(),name:n,col:$('#nn-c').value.trim()||'Demo Collection',g:gs[S.nfts.length%4],e:es[S.nfts.length%5]})}
else if(a==='reset'){if(!confirm('Reset all demo data?'))return;S=DEF()}
render()}
document.addEventListener('click',e=>{const el=e.target.closest('[data-a]');if(!el||/^(f|setTok|setTx|manual|setNick|cv.*)$/.test(el.dataset.a))return;
if(el.dataset.a==='close'&&el.classList.contains('sheet')&&e.target!==el)return;A(el.dataset.a,el.dataset.v,el,e)});
document.addEventListener('input',e=>{const el=e.target;if(el.dataset.a==='f'&&V.sh)V.sh.f[el.dataset.f]=el.value});
document.addEventListener('change',e=>{const el=e.target,a=el.dataset.a;if(!a)return;
if(a==='f'){V.sh.f[el.dataset.f]=el.value;return render()}
if(a==='setNick'){S.nick=el.value.trim().slice(0,20)||'Account 1';return render()}
if(a.startsWith('cv')){V.cv[el.dataset.f]=el.value;return render()}
const v=parseFloat(el.value);
if(a==='manual'){if(v>=0)S.manual=v}
else if(a==='setTok'){const t=S.tokens.find(x=>x.id===el.dataset.id);if(t&&v>=0)t[el.dataset.f]=v}
else if(a==='setTx'){const t=S.txs.find(x=>x.id==el.dataset.id),f=el.dataset.f;if(t){if(f==='status')t.status=el.value;else if(v>=0)t.amt=v}}
render()});
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));
render();
</script></body></html>
